    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page" id="" style="--status-bar-height:;">
    <div class="wx-scroll-view scroll" style="overflow-y:auto">
      <div class="wx-view cover-wrap">
        <div class="wx-swiper cover-swiper" data-autoplay="false" data-interval="5000" data-circular="true" data-dots="false" data-change=""></div>
        <div class="wx-view cover-wash"></div>
        <div class="wx-view cover-copy">
          <span class="wx-text cover-title"></span>
          <span class="wx-text cover-sub"></span>
        </div>
      </div>
      <div class="wx-view body">
        <span class="wx-text name"></span>
        <span class="wx-text subtitle"></span>
        <div class="wx-view price-row">
          <span class="wx-text price">¥</span>
          <span class="wx-text sales">已售 </span>
        </div>
      </div>
      <div class="wx-view guide-card">
        <div class="wx-view guide-row">
          <img class="wx-image guide-icon" style="object-fit:fill" src="">
          <div class="wx-view guide-copy">
            <span class="wx-text guide-title">适合谁</span>
            <span class="wx-text guide-text"></span>
          </div>
        </div>
        <div class="wx-view guide-row">
          <img class="wx-image guide-icon" style="object-fit:fill" src="">
          <div class="wx-view guide-copy">
            <span class="wx-text guide-title">为什么推荐</span>
            <span class="wx-text guide-text"></span>
          </div>
        </div>
        <div class="wx-view guide-row">
          <img class="wx-image guide-icon" style="object-fit:fill" src="">
          <div class="wx-view guide-copy">
            <span class="wx-text guide-title">口感关键词</span>
            <span class="wx-text guide-text"></span>
          </div>
        </div>
        <div class="wx-view guide-row">
          <img class="wx-image guide-icon" style="object-fit:fill" src="">
          <div class="wx-view guide-copy">
            <span class="wx-text guide-title">不适合谁</span>
            <span class="wx-text guide-text"></span>
          </div>
        </div>
        <div class="wx-view guide-row">
          <img class="wx-image guide-icon" style="object-fit:fill" src="">
          <div class="wx-view guide-copy">
            <div class="wx-view guide-head">
              <span class="wx-text guide-title">冲泡建议</span>
              <span class="wx-text guide-more" data-tap="">查看详情 ›</span>
            </div>
            <span class="wx-text guide-text"></span>
          </div>
        </div>
      </div>
      <div class="wx-view origin-card" data-tap="">
        <img class="wx-image origin-image" style="object-fit:cover" src="">
        <div class="wx-view origin-wash"></div>
        <div class="wx-view origin-copy">
          <span class="wx-text origin-title">产区与选茶说明</span>
          <span class="wx-text origin-text">本品精选凤凰核心产区茶青，涵盖三款代表香型：鸭屎香、蜜兰香、芝兰香。</span>
          <span class="wx-text origin-text">帮助您建立对不同香型的感知与偏好，找到属于自己的那一杯凤凰单枞。</span>
        </div>
      </div>
      <div class="wx-view qty">
        <span class="wx-text qty-t">数量</span>
        <div class="wx-view stepper">
          <span class="wx-text step-btn" data-tap="">−</span>
          <span class="wx-text step-n"></span>
          <span class="wx-text step-btn" data-tap="">+</span>
        </div>
      </div>
      <div class="wx-view intro">
        <span class="wx-text sec">商品详情</span>
        <div class="wx-rich-text intro-rich"></div>
      </div>
      <div class="wx-view bar-space"></div>
    </div>
    <div class="wx-view bar">
      <div class="wx-view consult" data-tap="">
        <img class="wx-image consult-icon" style="object-fit:fill" src="">
        <span class="wx-text consult-text">咨询</span>
      </div>
      <div class="wx-view btn-line" data-tap="">
        <span class="wx-text btn-line-t">加入购物车</span>
      </div>
      <div class="wx-view btn-fill" data-tap="">
        <span class="wx-text btn-fill-t">立即购买</span>
      </div>
    </div>
  </div>
  <div class="wx-wxs"></div>
</div>
