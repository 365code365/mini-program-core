    <div class="wx-view brand">

      <span class="wx-text brand-en">PHOENIX YUNXIU</span>
      <span class="wx-text brand-sub">凤凰山古树认养 · 数字化生态平台</span>
    </div>
    <div class="wx-view card">
      <div class="wx-view tabs">
        <span class="wx-text tab" data-tap="">手机验证码</span>

          <span class="wx-text f-label">验证码</span>

          </div>
        </div>
      </div>
      <div class="wx-view submit" data-tap="">
        <span class="wx-text submit-t"></span>
      </div>
      <div class="wx-view or-row">
        <div class="wx-view or-line"></div>
        <span class="wx-text or-t">微信快捷登录</span>
        <div class="wx-view or-line"></div>
      </div>
      <button class="wx-button wx-btn wx-button-default" data-getphonenumber="">
        <span class="wx-text wx-btn-t">微信一键登录</span>
      </button>
      <div class="wx-view skip" data-tap="">
        <span class="wx-text skip-t">先逛逛 ›</span>
      </div>
    </div>
    <div class="wx-view agree-row">
      <div class="wx-view cb-wrap" data-tap="">
        <div class="wx-view cb"></div>
      </div>
      <span class="wx-text agree">登录即代表同意</span>
      <span class="wx-text agree-link" data-tap="">《用户协议》</span>
      <span class="wx-text agree">与</span>
      <span class="wx-text agree-link" data-tap="">《隐私政策》</span>
    </div>
  </div>
  <div class="wx-wxs"></div>
</div>
