    <div class="wx-view bar">

        <span class="wx-text bar-label">实付</span>

      </div>
      <div class="wx-view btn" data-tap="">
        <span class="wx-text btn-t"></span>
      </div>
    </div>
  </div>
  <div class="wx-wxs"></div>
