<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/search/search</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./search.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view snav">
      <div class="wx-view snav-back" data-tap="onBack">
        <i class="wx-icon wxicon wxicon-back" style="width:20px;height:20px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 7.5 12 15.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view snav-box">
        <i class="wx-icon wxicon wxicon-search" style="width:14px;height:14px;color:#9A9A9A"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.4" cy="10.4" r="6.4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.2 15.2 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></i>
        <input class="wx-input snav-input" type="text" value="" placeholder="搜索新闻 / 视频 / 作者" data-input="onInput" data-confirm="onSearch">
      </div>
      <span class="wx-text snav-go" data-tap="onSearch">搜索</span>
    </div>
    <div class="wx-view">
      <div class="wx-view card">
        <div class="wx-view card-head">
          <span class="wx-text card-title">🔥 热搜榜</span>
          <span class="wx-text card-more" data-tap="onGoHot">完整榜单</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="数字经济">
          <span class="wx-text hot-idx idx-top">1</span>
          <span class="wx-text hot-word">数字经济</span>
          <span class="wx-text hot-flag">爆</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">210万</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="大飞机">
          <span class="wx-text hot-idx idx-top">2</span>
          <span class="wx-text hot-word">大飞机</span>
          <span class="wx-text hot-flag">热</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">128万</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="新能源车">
          <span class="wx-text hot-idx idx-top">3</span>
          <span class="wx-text hot-word">新能源车</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">165万</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="房贷利率">
          <span class="wx-text hot-idx idx-normal">4</span>
          <span class="wx-text hot-word">房贷利率</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">96万</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="联赛绝杀">
          <span class="wx-text hot-idx idx-normal">5</span>
          <span class="wx-text hot-word">联赛绝杀</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">188万</span>
        </div>
        <div class="wx-view hot-line" data-tap="onTapTag" data-ds-k="人工智能">
          <span class="wx-text hot-idx idx-normal">6</span>
          <span class="wx-text hot-word">人工智能</span>
          <span class="wx-text hot-flag">新</span>
          <div class="wx-view grow"></div>
          <span class="wx-text hot-num">74万</span>
        </div>
      </div>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>

<script>

</script>
<script src="../../common/runtime.js"></script>
<script src="../../common/app.js"></script>
<script src="./search.js"></script>
</body>
</html>
