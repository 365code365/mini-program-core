<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/mine/mine</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./mine.css">
  <link rel="stylesheet" href="../../common/tabbar.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;padding-bottom:50px;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view user-header" data-tap="onLoginTap">
      <img class="wx-image user-avatar" style="object-fit:cover" src="/assets/avatar1.jpg">
      <div class="wx-view user-info">
        <span class="wx-text user-name">头条读者</span>
        <span class="wx-text user-desc">已连续阅读 128 天</span>
      </div>
      <span class="wx-text user-arrow">&gt;</span>
    </div>
    <div class="wx-view stat-card">
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-label="关注">
        <span class="wx-text stat-value">42</span>
        <span class="wx-text stat-label">关注</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-label="收藏">
        <span class="wx-text stat-value">186</span>
        <span class="wx-text stat-label">收藏</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-label="历史">
        <span class="wx-text stat-value">1.2万</span>
        <span class="wx-text stat-label">历史</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-label="评论">
        <span class="wx-text stat-value">73</span>
        <span class="wx-text stat-label">评论</span>
      </div>
    </div>
    <div class="wx-view menu-card">
      <span class="wx-text menu-head">我的服务</span>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="1">
        <i class="wx-icon wxicon wxicon-success" style="width:20px;height:20px;color:#D43C33"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        <span class="wx-text menu-text">我的收藏</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="2">
        <i class="wx-icon wxicon wxicon-waiting" style="width:20px;height:20px;color:#F0A020"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="6.2" width="2.2" height="6.6" rx="1.1" fill="#fff"/><rect x="12" y="10.9" width="5.2" height="2.2" rx="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">阅读历史</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="3">
        <i class="wx-icon wxicon wxicon-info" style="width:20px;height:20px;color:#3A7BD5"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="7.6" r="1.7" fill="#fff"/><rect x="10.9" y="10.8" width="2.2" height="7" rx="1.1" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">消息通知</span>
        <span class="wx-text menu-badge">9</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="4">
        <i class="wx-icon wxicon wxicon-warn" style="width:20px;height:20px;color:#7B61FF"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="5.4" width="2.2" height="7.2" rx="1.1" fill="#fff"/><circle cx="12" cy="16.6" r="1.7" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">意见反馈</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
    </div>
    <div class="wx-view menu-card">
      <span class="wx-text menu-head">阅读设置</span>
      <div class="wx-view switch-row">
        <span class="wx-text switch-label">夜间模式</span>
        <div class="wx-switch" data-change="onNightModeChange"><span class="wx-switch-knob"></span></div>
      </div>
      <div class="wx-view switch-row">
        <span class="wx-text switch-label">非 Wi-Fi 自动播放</span>
        <div class="wx-switch wx-switch-on" data-change="onAutoPlayChange"><span class="wx-switch-knob"></span></div>
      </div>
      <div class="wx-view slider-row">
        <span class="wx-text switch-label">正文字号</span>
        <div class="wx-slider-wrap" data-change="onFontLevelChange"><input class="wx-slider" type="range" min="1" max="5" step="1" value="3" style="background:linear-gradient(to right,#09bb07 0%,#09bb07 50%,#e5e5e5 50%,#e5e5e5 100%);--wx-block:#ffffff"><span class="wx-slider-value">3</span></div>
      </div>
    </div>
    <div class="wx-view logout-wrap">
      <button class="wx-button logout-btn wx-button-default" data-tap="onLogout">退出登录</button>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
<nav class="wx-custom-tabbar"><div class="wx-view news-tabbar"><div class="wx-view tab-item " data-tap="switchTab" data-ds-path="pages/home/home" data-tabbar-href="../../pages/home/home.html" data-ds-index="0"><i class="wx-icon wxicon wxicon-success" style="width:22px;height:22px;color:#B5B5B5"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span class="wx-text tab-label ">首页</span></div><div class="wx-view tab-item " data-tap="switchTab" data-ds-path="pages/video/video" data-tabbar-href="../../pages/video/video.html" data-ds-index="1"><i class="wx-icon wxicon wxicon-waiting" style="width:22px;height:22px;color:#B5B5B5"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="6.2" width="2.2" height="6.6" rx="1.1" fill="#fff"/><rect x="12" y="10.9" width="5.2" height="2.2" rx="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i><span class="wx-text tab-label ">视频</span></div><div class="wx-view tab-item tab-active" data-tap="switchTab" data-ds-path="pages/mine/mine" data-tabbar-href="../../pages/mine/mine.html" data-ds-index="2"><i class="wx-icon wxicon wxicon-info" style="width:22px;height:22px;color:#D43C33"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="7.6" r="1.7" fill="#fff"/><rect x="10.9" y="10.8" width="2.2" height="7" rx="1.1" fill="#fff"/></svg></i><span class="wx-text tab-label tab-label-active">我的</span></div></div></nav>
<script>
(function(){var bar=document.currentScript&&document.currentScript.previousElementSibling;
if(!bar||!bar.classList.contains('wx-custom-tabbar')){bar=document.querySelector('.wx-custom-tabbar');}
if(!bar)return;
bar.addEventListener('click',function(e){
var el=e.target.closest?e.target.closest('[data-tabbar-href]'):null;
if(!el)return;
var href=el.getAttribute('data-tabbar-href');
if(href){e.preventDefault();e.stopPropagation();window.location.href=href;}
},true);})();
</script>

</html>
