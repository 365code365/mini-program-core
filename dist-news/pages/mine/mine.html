<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/mine/mine</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./mine.css">
  <link rel="stylesheet" href="../../common/tabbar.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;padding-bottom:50px;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view user-header" data-tap="onLoginTap">
      <img class="wx-image user-avatar" style="object-fit:cover" src="/assets/avatar1.jpg">
      <div class="wx-view user-info">
        <span class="wx-text user-name">头条读者</span>
        <span class="wx-text user-desc">已连续签到 0 天 · 阅读 0 篇</span>
      </div>
      <span class="wx-text user-arrow">&gt;</span>
    </div>
    <div class="wx-view stat-card">
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-key="follow">
        <span class="wx-text stat-value">0</span>
        <span class="wx-text stat-label">关注</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-key="fav">
        <span class="wx-text stat-value">0</span>
        <span class="wx-text stat-label">收藏</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-key="history">
        <span class="wx-text stat-value">0</span>
        <span class="wx-text stat-label">历史</span>
      </div>
      <div class="wx-view stat-item" data-tap="onStatTap" data-ds-key="hot">
        <span class="wx-text stat-value">榜</span>
        <span class="wx-text stat-label">热榜</span>
      </div>
    </div>
    <div class="wx-view menu-card">
      <span class="wx-text menu-head">我的服务</span>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="fav">
        <i class="wx-icon wxicon wxicon-star" style="width:20px;height:20px;color:#D43C33"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M12 18.5l-4.672 2.456a1 1 0 01-1.451-1.054l.892-5.202-3.78-3.685a1 1 0 01.555-1.706l5.223-.759 2.336-4.733a1 1 0 011.794 0l2.336 4.733 5.223.76a1 1 0 01.555 1.705L17.23 14.7l.892 5.202a1 1 0 01-1.45 1.054L12 18.5z"/></svg></i>
        <span class="wx-text menu-text">我的收藏</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="history">
        <i class="wx-icon wxicon wxicon-clock" style="width:20px;height:20px;color:#F0A020"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M12.6 11.503l3.891 3.891-.848.849L11.4 12V6h1.2v5.503zM12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-1.2a8.8 8.8 0 100-17.6 8.8 8.8 0 000 17.6z"/></svg></i>
        <span class="wx-text menu-text">阅读历史</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="search">
        <i class="wx-icon wxicon wxicon-search" style="width:20px;height:20px;color:#3A7BD5"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M16.31 15.561l4.114 4.115-.848.848-4.123-4.123a7 7 0 11.857-.84zM16.8 11a5.8 5.8 0 10-11.6 0 5.8 5.8 0 0011.6 0z"/></svg></i>
        <span class="wx-text menu-text">搜索发现</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="hot">
        <i class="wx-icon wxicon wxicon-arrow_up" style="width:20px;height:20px;color:#7B61FF"><svg viewBox="0 0 24 12" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="translate(0 12) rotate(-90)"><path d="M10.157 12.711L4.5 18.368l-1.414-1.414 4.95-4.95-4.95-4.95L4.5 5.64l5.657 5.657a1 1 0 010 1.414z"/></g></svg></i>
        <span class="wx-text menu-text">热榜与签到</span>
        <span class="wx-text menu-badge">未签</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
    </div>
    <div class="wx-view menu-card">
      <span class="wx-text menu-head">阅读设置</span>
      <div class="wx-view switch-row">
        <span class="wx-text switch-label">夜间模式</span>
        <div class="wx-switch" data-change="onNightModeChange"><span class="wx-switch-knob"></span></div>
      </div>
      <div class="wx-view switch-row">
        <span class="wx-text switch-label">非 Wi-Fi 自动播放</span>
        <div class="wx-switch wx-switch-on" data-change="onAutoPlayChange"><span class="wx-switch-knob"></span></div>
      </div>
      <div class="wx-view slider-row">
        <span class="wx-text switch-label">正文字号</span>
        <div class="wx-slider-wrap" data-change="onFontLevelChange"><input class="wx-slider" type="range" min="1" max="5" step="1" value="3" style="background:linear-gradient(to right,#D43C33 0%,#D43C33 50%,#e5e5e5 50%,#e5e5e5 100%);--wx-block:#ffffff"><span class="wx-slider-value">3</span></div>
        <span class="wx-text font-sample" style="font-size:17px">正文预览：数字经济规模再创新高。</span>
      </div>
    </div>
    <div class="wx-view logout-wrap">
      <button class="wx-button logout-btn wx-button-default" data-tap="onLogout">退出登录</button>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>

<script>
(function(){var bar=document.currentScript&&document.currentScript.previousElementSibling;
if(!bar||!bar.classList.contains('wx-custom-tabbar')){bar=document.querySelector('.wx-custom-tabbar');}
if(!bar)return;
bar.addEventListener('click',function(e){
var el=e.target.closest?e.target.closest('[data-tabbar-href]'):null;
if(!el)return;
var href=el.getAttribute('data-tabbar-href');
if(href){e.preventDefault();e.stopPropagation();window.location.href=href;}
},true);})();
</script>
