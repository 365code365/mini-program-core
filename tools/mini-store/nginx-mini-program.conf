# mini-program.51aihelp.com：商店服务（9630）与官网（9640）走同一个 HTTPS 域名。
# 放在服务器的 /www/server/panel/vhost/nginx/mini-program.conf（宝塔的 nginx 会 include 这个目录），
# 证书由 acme.sh（Let's Encrypt，webroot 方式）签发并自动续期，装到 /etc/ssl/mini-program/。
#
# 路由：/api/ /admin /open /a/ 与商店的几个脚本 → 9630；其余（官网首页、介绍页、App 下载）→ 9640。
# 旧的 http://64.83.22.217:9630 / :9640 仍然直连可用（已装的旧版 App 还在用）。

server {
    listen 80;
    server_name mini-program.51aihelp.com;
    # acme.sh 续期时的 HTTP-01 验证
    location /.well-known/acme-challenge/ { root /www/wwwroot/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name mini-program.51aihelp.com;

    ssl_certificate     /etc/ssl/mini-program/fullchain.pem;
    ssl_certificate_key /etc/ssl/mini-program/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:mini_program_ssl:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 管理后台上传的小程序 / 小游戏包（农场这种 12MB，留足余量）
    client_max_body_size 200m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # 包下载（几十 MB）不经 nginx 落盘缓冲，直接转给客户端
    proxy_buffering off;
    proxy_request_buffering off;

    location /api/ { proxy_pass http://127.0.0.1:9630; }
    location = /admin { proxy_pass http://127.0.0.1:9630; }
    location = /open { proxy_pass http://127.0.0.1:9630; }
    location /a/ { proxy_pass http://127.0.0.1:9630; }
    location ~ ^/(admin|open|pager)\.js$ { proxy_pass http://127.0.0.1:9630; }

    location / { proxy_pass http://127.0.0.1:9640; }
}
