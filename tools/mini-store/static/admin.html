<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小程序管理</title>
<style>
  :root { --green: #07c160; --line: #e5e5e5; --sub: #888; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; color: #222; }
  header { background: #fff; border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 17px; margin: 0; flex: 1; }
  main { max-width: 980px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 15px; margin: 0 0 14px; }
  label { display: block; margin: 10px 0 4px; color: #555; }
  input[type=text], input[type=password] { width: 100%; padding: 8px 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
  button { padding: 7px 16px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-size: 14px; }
  button.primary { background: var(--green); border-color: var(--green); color: #fff; }
  button.danger { color: #e64340; }
  button:disabled { opacity: .5; cursor: default; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 200px; }
  .hint { color: var(--sub); font-size: 12px; }
  .msg { margin-top: 10px; min-height: 20px; }
  .msg.err { color: #e64340; }
  .msg.ok { color: var(--green); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--sub); font-weight: normal; font-size: 12px; }
  .icon { width: 36px; height: 36px; border-radius: 50%; color: #fff; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; }
  .name { font-weight: 600; }
  .id { color: var(--sub); font-size: 12px; }
  .ops button { margin-right: 6px; padding: 4px 10px; font-size: 13px; }
  #login { max-width: 360px; margin: 80px auto; }
  .hidden { display: none !important; }
  .src { display: flex; gap: 16px; margin: 6px 0; }
  .src label { display: inline; margin: 0; color: #222; }
  select { padding: 7px 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; background: #fff; }
  img.icon { object-fit: cover; border-radius: 9px; }
  .icon.letter { border-radius: 9px; }
  .tags { margin-top: 4px; display: flex; flex-wrap: wrap; gap: 4px; }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #f0f0f0; color: #666; }
  .cat { font-size: 11px; padding: 1px 6px; border-radius: 3px; background: #e8f8ef; color: #07a050; margin-left: 6px; font-weight: normal; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .toolbar input { flex: 1; min-width: 200px; }
  .stats { display: flex; gap: 24px; margin-bottom: 12px; }
  .stats b { font-size: 20px; display: block; }
  dialog { border: 0; border-radius: 10px; padding: 20px; width: min(520px, 92vw); box-shadow: 0 8px 40px rgba(0,0,0,.2); }
  dialog::backdrop { background: rgba(0,0,0,.35); }
  .hot { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
</style>
</head>
<body>
<div id="login" class="card hidden">
  <h2>小程序管理 · 登录</h2>
  <form id="loginForm">
    <label for="lu">账户</label><input id="lu" type="text" autocomplete="username" required>
    <label for="lp">密码</label><input id="lp" type="password" autocomplete="current-password" required>
    <div style="margin-top:16px"><button class="primary" type="submit">登录</button></div>
    <div id="loginMsg" class="msg err" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header>
    <h1>小程序管理</h1>
    <span id="who" class="hint"></span>
    <button id="logout" type="button">退出</button>
  </header>
  <main>
    <section class="card">
      <h2>上传小程序</h2>
      <form id="uploadForm">
        <div class="row">
          <div><label for="uid">ID（目录名，小写字母 / 数字 / . _ -；同 ID 上传 = 升级）</label><input id="uid" type="text" required pattern="[a-z0-9][a-z0-9._\-]{0,63}"></div>
          <div><label for="uname">名称（不填用 app.json 的导航栏标题）</label><input id="uname" type="text" maxlength="200"></div>
        </div>
        <label for="udesc">描述</label><input id="udesc" type="text" maxlength="200">
        <div class="row">
          <div><label for="ucat">分类（不选 = 用包里 store.meta.json 的，没有就是「其他」）</label><select id="ucat"><option value="">—</option></select></div>
          <div><label for="utags">搜索标签（逗号分隔）</label><input id="utags" type="text" maxlength="200"></div>
          <div><label for="udev">开发者</label><input id="udev" type="text" maxlength="60"></div>
        </div>
        <label>代码</label>
        <div class="src" role="radiogroup">
          <span><input type="radio" name="src" id="srcDir" value="dir" checked><label for="srcDir">选文件夹（含 app.json 的那一层）</label></span>
          <span><input type="radio" name="src" id="srcZip" value="zip"><label for="srcZip">选 zip</label></span>
        </div>
        <input id="udir" type="file" webkitdirectory multiple aria-label="小程序文件夹">
        <input id="uzip" type="file" accept=".zip,application/zip" class="hidden" aria-label="小程序 zip">
        <div class="hint">文件夹会在浏览器里打成 zip 再传；app.json 可以在 zip 根上，也可以在唯一一层子目录里。</div>
        <div style="margin-top:14px"><button id="ubtn" class="primary" type="submit">上传</button></div>
        <div id="uploadMsg" class="msg" role="status"></div>
      </form>
    </section>
    <section class="card">
      <h2>已上架 <span id="count" class="hint"></span></h2>
      <div class="stats">
        <div><b id="stApps">-</b><span class="hint">小程序</span></div>
        <div><b id="stCats">-</b><span class="hint">分类</span></div>
        <div><b id="stDl">-</b><span class="hint">累计打开</span></div>
        <div style="flex:1"><span class="hint">热搜</span><div id="hot" class="hot"></div></div>
      </div>
      <div class="toolbar">
        <input id="q" type="text" placeholder="搜索名称 / 标签 / 开发者 / 描述（与 App 里的搜索同一套）" aria-label="搜索">
        <select id="fcat" aria-label="按分类筛选"><option value="">全部分类</option></select>
      </div>
      <table>
        <thead><tr><th></th><th>名称 / ID</th><th>开发者</th><th>版本</th><th>大小</th><th>打开</th><th>更新</th><th>操作</th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </section>
    <section class="card">
      <h2>诊断日志 <span id="diagCount" class="hint"></span></h2>
      <div class="hint">App 里点「上传诊断日志」传上来的；开发机上 <code>bash tools/mini-store/diag.sh get &lt;id&gt;</code> 拉回来分析。</div>
      <table>
        <thead><tr><th>id / 时间</th><th>宿主 / 设备</th><th>小程序</th><th>日志</th><th>说明</th><th>操作</th></tr></thead>
        <tbody id="diagList"></tbody>
      </table>
    </section>
  </main>
</div>
<dialog id="editDlg">
  <form method="dialog" id="editForm">
    <h2 style="margin-top:0">编辑展示信息</h2>
    <label for="ename">名称</label><input id="ename" type="text" maxlength="200" required>
    <label for="edesc">描述</label><input id="edesc" type="text" maxlength="200">
    <div class="row">
      <div><label for="ecat">分类</label><select id="ecat"></select></div>
      <div><label for="eorder">排序（小的在前）</label><input id="eorder" type="text" inputmode="numeric"></div>
    </div>
    <label for="etags">搜索标签（逗号分隔）</label><input id="etags" type="text" maxlength="200">
    <label for="edev">开发者</label><input id="edev" type="text" maxlength="60">
    <div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">
      <button value="cancel" formnovalidate>取消</button><button class="primary" value="ok">保存</button>
    </div>
  </form>
</dialog>
<script src="/admin.js"></script>
</body>
</html>
