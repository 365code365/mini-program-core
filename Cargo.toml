[package]
name = "mini-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "mini_render"
# cdylib: 动态库(.so/.dylib/.dll, 供 Android/Linux/Windows/macOS 使用)
# staticlib: 静态库(.a, 供 iOS XCFramework / 静态链接使用)
# rlib: Rust 库(供 Rust 项目依赖)
crate-type = ["cdylib", "staticlib", "rlib"]

# ── 特性开关 ──
#
# 移动端（iOS / Android / 鸿蒙）把引擎当 **动态库/静态库** 用，宿主自己有窗口、
# 自己接触摸和输入法，所以**不能**把桌面那套窗口与设备依赖编进去：
# - `winit` 在 android 目标上必须选一个 activity 后端特性，否则直接编译失败；
# - `arboard`（剪贴板）只支持 X11/macOS/Windows；
# - `rodio`（音频设备）在移动端要走 oboe/AAudio，宿主用系统播放器更合适。
#
# 所以这些都放在 `desktop` / `audio` 后面，移动端用 `--no-default-features` 构建。
[features]
# 默认同时编进 CPU 与 GPU 两个后端，运行时选（交互窗体 auto；无头与回归脚本 cpu）。
# 只要 CPU：`cargo build --release --no-default-features --features desktop,audio,h264`
default = ["desktop", "audio", "h264", "gpu"]
# 桌面宿主（自带窗口、上屏、剪贴板）
desktop = ["winit", "softbuffer", "arboard"]
# 内置音频播放（video 组件的声音）
audio = ["rodio"]
# 内置 H.264 软解（<video> 的画面帧）。移动端建议关掉：交给系统播放器硬解更省电，
# 而且 openh264-sys2 在 iOS **模拟器**目标上编不过（build.rs 不认 target_env="sim"）。
h264 = ["openh264"]
# 交叉编译用：rquickjs-sys 只为少数目标预生成了 C 绑定（没有 iOS/Android/鸿蒙），
# 打开它改为在构建时用 libclang 现场生成。移动端构建必须带上。
bindgen = ["rquickjs/bindgen"]
# GPU 合成后端（wgpu）：页面 / tabBar / fixed 覆盖层作为纹理镜像、按脏区上传，
# 用整数着色器复刻 CPU 的合成算术后直接上屏（设计见 .agents/tasks/gpu-dual-backend-2026-10-12/）。
# 内容仍由 CPU 光栅化。**CPU 后端是参考实现、永远可用**：关掉这个 feature 照常编译、照常过全部回归；
# 开了也只在偏好 auto / gpu 且门槛、自检都过了时才用，任何失败一律回退 CPU。
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
image = "0.25"
fontdue = "0.9"
rquickjs = { version = "0.12", features = ["classes", "properties"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = "0.12"
ureq = "3.3"
# wx.connectSocket：WebSocket 协议本身（握手、分帧、掩码、ping/pong）。
# 只开 handshake，TLS 自己接（下面两条与 ureq 用的是同一份 rustls / 根证书，不多编一套）
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
rustls = { version = "=0.23.42", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "=1.0.9"
# 桥上只有字符串：二进制（WebSocket 帧、文件内容、音频）按 base64 过桥。与 ureq 用的是同一份
base64 = "=0.22.1"
# FileSystemManager.unzip 的 deflate 解压（ureq 的 gzip 用的就是它，不多编一份）
flate2 = "=1.1.9"
once_cell = "1.21"
# 音频解码（纯解码，无设备依赖，移动端也留着）
symphonia = { version = "0.6", features = ["isomp4", "aac", "mp3"] }
# H.264 解码 (纯 Rust，可选)
openh264 = { version = "0.9", optional = true }

# ── 桌面专用（可选）──
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }
rodio = { version = "0.22", optional = true }
# ── GPU 合成后端（可选，feature `gpu`）──
# 版本锁死：wgpu 大约一季度一个破坏性大版本，升级要单独立项并重跑全部 GPU 判据。
# 传递依赖由入库的 Cargo.lock 锁定，`cargo update` 只能单独提交。
# 只开用得到的后端：wgpu 内部按目标门控（metal 只在 Apple、vulkan/gles 只在 Windows/Linux/Android、
# dx12 只在 Windows 生效），所以一条声明覆盖全部平台；不开 webgpu（没有浏览器目标）。
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "metal", "vulkan", "gles", "dx12"] }
# request_adapter / request_device / map_async 都是 future，宿主是同步的：用最小的 block_on
pollster = { version = "=1.0.1", optional = true }

# ── Android 专用：JNI 入口（只在 android 目标编译，其它平台一行代码都不带）──
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
cbindgen = "0.29"

# 加速开发编译
[profile.dev]
opt-level = 0
debug = false  # 减少调试信息生成时间

[profile.dev.package."*"]
opt-level = 2  # 依赖库用优化编译，运行更快

# release = 日常开发与**全部回归脚本**用的这一档：不做 LTO、开增量。
#
# 为什么不做 LTO：thin LTO 要给**每个最终二进制**把整张依赖图（wgpu / naga / QuickJS / openh264…）
# 的位码重新优化、重新生成一遍机器码。这个仓库一次 `--all-targets` 要出 5 个 bin、20 个 example、
# 22 个集成测试、lib 测试与 cdylib/staticlib —— 五十来个二进制各做一遍。2026-10-21 同一台机器、
# 同一份源码背靠背实测（负载 22~38，交换区已满）：改了引擎之后 `cargo build --release --all-targets`
# thin LTO **2905s**（单个二进制的 LTO 链接 4~11 分钟），关掉 LTO + 增量 **19~22s**；
# 后者从零（含全部依赖）编完 457s。
# 像素不受影响：Rust 不做 fast-math、不自动融合 FMA —— gallery 65 张两种编法**逐字节相同**，
# 跑完 65 个场景的耗时也分不出差别（4.4~5.7s 对 5.0~5.3s）。
#
# 发给宿主的库（移动端 SDK、桌面分发）仍要 thin LTO（体积更小、跨 crate 内联拿满）：
# tools/build-mobile.sh 与 scripts/build-*.sh 用环境变量
# `CARGO_PROFILE_RELEASE_LTO=thin CARGO_PROFILE_RELEASE_INCREMENTAL=false` 打开。
# 交叉编译目标各有自己的 target/<triple>/release 目录，与这里的开发构建互不干扰、不会来回全量重编。
[profile.release]
lto = false
incremental = true

[[bin]]
name = "mini-app"
path = "src/bin/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-app-window"
path = "src/bin/window.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-launcher"
path = "src/bin/launcher.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-devserver"
path = "src/bin/devserver.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-compiler"
path = "src/bin/compiler.rs"
required-features = ["desktop"]

[dev-dependencies]
# 只给 examples/_font_probe.rs 用：量「惰性解析字体」的内存基线
ttf-parser = "0.25"
