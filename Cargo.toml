[package]
name = "mini-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "mini_render"
# cdylib: 动态库(.so/.dylib/.dll, 供 Android/Linux/Windows/macOS 使用)
# staticlib: 静态库(.a, 供 iOS XCFramework / 静态链接使用)
# rlib: Rust 库(供 Rust 项目依赖)
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
image = "0.25"
fontdue = "0.9"
rquickjs = { version = "0.12", features = ["classes", "properties"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winit = "0.30"
softbuffer = "0.4"
taffy = "0.12"
arboard = "3"
ureq = "3.3"
once_cell = "1.21"
# 音频解码和播放
symphonia = { version = "0.6", features = ["isomp4", "aac", "mp3"] }
rodio = "0.22"
# H.264 解码 (纯 Rust)
openh264 = "0.9"

[build-dependencies]
cbindgen = "0.29"

# 加速开发编译
[profile.dev]
opt-level = 0
debug = false  # 减少调试信息生成时间

[profile.dev.package."*"]
opt-level = 2  # 依赖库用优化编译，运行更快

# release 模式优化
[profile.release]
lto = "thin"  # 轻量级 LTO，比 fat 快

[[bin]]
name = "mini-app"
path = "src/bin/main.rs"

[[bin]]
name = "mini-app-window"
path = "src/bin/window.rs"

[[bin]]
name = "mini-launcher"
path = "src/bin/launcher.rs"

[[bin]]
name = "mini-devserver"
path = "src/bin/devserver.rs"

[[bin]]
name = "mini-compiler"
path = "src/bin/compiler.rs"

[dev-dependencies]
# 只给 examples/_font_probe.rs 用：量「惰性解析字体」的内存基线
ttf-parser = "0.25"
