[package]
name = "mini-render"
version = "0.1.0"
edition = "2021"

[lib]
name = "mini_render"
# cdylib: 动态库(.so/.dylib/.dll, 供 Android/Linux/Windows/macOS 使用)
# staticlib: 静态库(.a, 供 iOS XCFramework / 静态链接使用)
# rlib: Rust 库(供 Rust 项目依赖)
crate-type = ["cdylib", "staticlib", "rlib"]

# ── 特性开关 ──
#
# 移动端（iOS / Android / 鸿蒙）把引擎当 **动态库/静态库** 用，宿主自己有窗口、
# 自己接触摸和输入法，所以**不能**把桌面那套窗口与设备依赖编进去：
# - `winit` 在 android 目标上必须选一个 activity 后端特性，否则直接编译失败；
# - `arboard`（剪贴板）只支持 X11/macOS/Windows；
# - `rodio`（音频设备）在移动端要走 oboe/AAudio，宿主用系统播放器更合适。
#
# 所以这些都放在 `desktop` / `audio` 后面，移动端用 `--no-default-features` 构建。
[features]
default = ["desktop", "audio", "h264"]
# 桌面宿主（自带窗口、上屏、剪贴板）
desktop = ["winit", "softbuffer", "arboard"]
# 内置音频播放（video 组件的声音）
audio = ["rodio"]
# 内置 H.264 软解（<video> 的画面帧）。移动端建议关掉：交给系统播放器硬解更省电，
# 而且 openh264-sys2 在 iOS **模拟器**目标上编不过（build.rs 不认 target_env="sim"）。
h264 = ["openh264"]
# 交叉编译用：rquickjs-sys 只为少数目标预生成了 C 绑定（没有 iOS/Android/鸿蒙），
# 打开它改为在构建时用 libclang 现场生成。移动端构建必须带上。
bindgen = ["rquickjs/bindgen"]
# GPU 合成后端（wgpu）：页面 / tabBar / fixed 覆盖层作为纹理镜像、按脏区上传，
# 用整数着色器复刻 CPU 的合成算术后直接上屏（设计见 .agents/tasks/gpu-dual-backend-2026-10-12/）。
# 内容仍由 CPU 光栅化。**CPU 后端是参考实现、永远可用**：关掉这个 feature 照常编译、照常过全部回归；
# 开了也只在偏好 auto / gpu 且门槛、自检都过了时才用，任何失败一律回退 CPU。
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
image = "0.25"
fontdue = "0.9"
rquickjs = { version = "0.12", features = ["classes", "properties"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
taffy = "0.12"
ureq = "3.3"
once_cell = "1.21"
# 音频解码（纯解码，无设备依赖，移动端也留着）
symphonia = { version = "0.6", features = ["isomp4", "aac", "mp3"] }
# H.264 解码 (纯 Rust，可选)
openh264 = { version = "0.9", optional = true }

# ── 桌面专用（可选）──
winit = { version = "0.30", optional = true }
softbuffer = { version = "0.4", optional = true }
arboard = { version = "3", optional = true }
rodio = { version = "0.22", optional = true }
# ── GPU 合成后端（可选，feature `gpu`）──
# 版本锁死：wgpu 大约一季度一个破坏性大版本，升级要单独立项并重跑全部 GPU 判据。
# 传递依赖由入库的 Cargo.lock 锁定，`cargo update` 只能单独提交。
# 只开用得到的后端：wgpu 内部按目标门控（metal 只在 Apple、vulkan/gles 只在 Windows/Linux/Android、
# dx12 只在 Windows 生效），所以一条声明覆盖全部平台；不开 webgpu（没有浏览器目标）。
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["std", "wgsl", "metal", "vulkan", "gles", "dx12"] }
# request_adapter / request_device / map_async 都是 future，宿主是同步的：用最小的 block_on
pollster = { version = "=1.0.1", optional = true }

# ── Android 专用：JNI 入口（只在 android 目标编译，其它平台一行代码都不带）──
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[build-dependencies]
cbindgen = "0.29"

# 加速开发编译
[profile.dev]
opt-level = 0
debug = false  # 减少调试信息生成时间

[profile.dev.package."*"]
opt-level = 2  # 依赖库用优化编译，运行更快

# release 模式优化
[profile.release]
lto = "thin"  # 轻量级 LTO，比 fat 快

[[bin]]
name = "mini-app"
path = "src/bin/main.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-app-window"
path = "src/bin/window.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-launcher"
path = "src/bin/launcher.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-devserver"
path = "src/bin/devserver.rs"
required-features = ["desktop"]

[[bin]]
name = "mini-compiler"
path = "src/bin/compiler.rs"
required-features = ["desktop"]

[dev-dependencies]
# 只给 examples/_font_probe.rs 用：量「惰性解析字体」的内存基线
ttf-parser = "0.25"
