<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/orders/orders</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./orders.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view nav-bar">
      <div class="wx-view nav-back" data-tap="onBack">
        <i class="wx-icon wxicon wxicon-back" style="width:20px;height:20px;color:#ffffff"><svg viewBox="0 0 12 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M3.343 12l7.071 7.071L9 20.485l-7.778-7.778a1 1 0 010-1.414L9 3.515l1.414 1.414L3.344 12z"/></svg></i>
      </div>
      <span class="wx-text nav-title">我的订单</span>
      <div class="wx-view nav-action" data-tap="onGoHome">
        <i class="wx-icon wxicon wxicon-success_no_circle" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M8.657 18.435L3 12.778l1.414-1.414 4.95 4.95L20.678 5l1.414 1.414-12.02 12.021a1 1 0 01-1.415 0z"/></svg></i>
      </div>

    <div class="wx-scroll-view tabs" style="display:flex;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden">
      <div class="wx-view tabs-row">
        <span class="wx-text pill pill-on" data-tap="onSwitchStatus" data-ds-key="all">全部(2)</span>
        <span class="wx-text pill " data-tap="onSwitchStatus" data-ds-key="pending">待付款(0)</span>
        <span class="wx-text pill " data-tap="onSwitchStatus" data-ds-key="paid">待发货(0)</span>
        <span class="wx-text pill " data-tap="onSwitchStatus" data-ds-key="shipping">运输中(1)</span>
        <span class="wx-text pill " data-tap="onSwitchStatus" data-ds-key="done">已完成(1)</span>
      </div>
    </div>
    <div class="wx-view order-card anim-fade-up">
      <div class="wx-view row-between">
        <span class="wx-text order-no">订单号 SO20260712001</span>
        <span class="wx-text order-status ">运输中</span>
      </div>
      <div class="wx-view divider gap"></div>
      <div class="wx-view order-goods" data-tap="onGoodsTap" data-ds-id="101">
        <img class="wx-image order-img" style="object-fit:cover" src="/assets/p_earbuds.jpg">
        <div class="wx-view col grow order-info">
          <span class="wx-text order-name">无线蓝牙耳机 Pro</span>
          <span class="wx-text muted">规格：黑色 · x1</span>
        </div>
        <span class="wx-text price">¥199</span>
      </div>
      <div class="wx-view row-between order-foot">
        <span class="wx-text muted">2026-07-12 10:24 · 顺丰特快</span>
        <span class="wx-text order-total">实付 ¥199.00</span>
      </div>
      <div class="wx-view ship-box">
        <div class="wx-view row-between" data-tap="onToggleTrace" data-ds-id="SO20260712001">
          <span class="wx-text h2">物流进度 65%</span>
          <div class="wx-view row">
            <span class="wx-text muted">展开</span>
            <i class="wx-icon wxicon wxicon-arrow_down" style="width:12px;height:12px;color:#999"><svg viewBox="0 0 24 12" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="translate(24 0) rotate(90)"><path d="M10.157 12.711L4.5 18.368l-1.414-1.414 4.95-4.95-4.95-4.95L4.5 5.64l5.657 5.657a1 1 0 010 1.414z"/></g></svg></i>
          </div>
        </div>
        <div class="wx-progress"><div class="wx-progress-outer"><div class="wx-progress-inner" style="width:65%;background:#FF6B35"></div></div></div>
      </div>
      <div class="wx-view row order-actions">
        <div class="wx-view ghost-btn" data-tap="onContact">联系客服</div>
        <div class="wx-view primary-btn" data-tap="onConfirm" data-ds-id="SO20260712001">确认收货</div>
      </div>
    </div>
    <div class="wx-view order-card anim-fade-up">
      <div class="wx-view row-between">
        <span class="wx-text order-no">订单号 SO20260705002</span>
        <span class="wx-text order-status ">已完成</span>
      </div>
      <div class="wx-view divider gap"></div>
      <div class="wx-view order-goods" data-tap="onGoodsTap" data-ds-id="102">
        <img class="wx-image order-img" style="object-fit:cover" src="/assets/p_watch.jpg">
        <div class="wx-view col grow order-info">
          <span class="wx-text order-name">智能运动手表</span>
          <span class="wx-text muted">规格：午夜黑 · x1</span>
        </div>
        <span class="wx-text price">¥599</span>
      </div>
      <div class="wx-view order-goods" data-tap="onGoodsTap" data-ds-id="105">
        <img class="wx-image order-img" style="object-fit:cover" src="/assets/p_coffee.jpg">
        <div class="wx-view col grow order-info">
          <span class="wx-text order-name">精品咖啡礼盒</span>
          <span class="wx-text muted">规格：中深烘焙 · x1</span>
        </div>
        <span class="wx-text price">¥89</span>
      </div>
      <div class="wx-view row-between order-foot">
        <span class="wx-text muted">2026-07-05 19:02 · 普通快递</span>
        <span class="wx-text order-total">实付 ¥688.00</span>
      </div>
      <div class="wx-view ship-box">
        <div class="wx-view row-between" data-tap="onToggleTrace" data-ds-id="SO20260705002">
          <span class="wx-text h2">物流进度 100%</span>
          <div class="wx-view row">
            <span class="wx-text muted">展开</span>
            <i class="wx-icon wxicon wxicon-arrow_down" style="width:12px;height:12px;color:#999"><svg viewBox="0 0 24 12" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><g transform="translate(24 0) rotate(90)"><path d="M10.157 12.711L4.5 18.368l-1.414-1.414 4.95-4.95-4.95-4.95L4.5 5.64l5.657 5.657a1 1 0 010 1.414z"/></g></svg></i>
          </div>
        </div>
        <div class="wx-progress"><div class="wx-progress-outer"><div class="wx-progress-inner" style="width:100%;background:#FF6B35"></div></div></div>
      </div>
      <div class="wx-view row order-actions">
        <div class="wx-view ghost-btn" data-tap="onContact">联系客服</div>
        <div class="wx-view primary-btn" data-tap="onReview" data-ds-id="SO20260705002">去评价</div>
      </div>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
