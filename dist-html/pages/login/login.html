<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/login/login</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./login.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view logo-wrap">
      <div class="wx-view logo">M</div>
      <span class="wx-text brand">Mini Shop</span>
      <span class="wx-text slogan">登录享更多会员权益</span>
    </div>
    <div class="wx-view form">
      <div class="wx-view field-row">
        <span class="wx-text field-label">手机号</span>
        <input class="wx-input field-input" type="number" value="" placeholder="请输入手机号">
      </div>
      <div class="wx-view field-row">
        <span class="wx-text field-label">验证码</span>
        <input class="wx-input field-input" type="number" value="" placeholder="请输入验证码">
        <div class="wx-view code-btn " data-tap="onSendCode">获取验证码</div>
      </div>
      <div class="wx-view agree-row" data-tap="onToggleAgree">
        <input class="wx-checkbox agree-cb" type="checkbox">
        <span class="wx-text agree-text">我已阅读并同意《用户协议》和《隐私政策》</span>
      </div>
      <button class="wx-button login-btn wx-button-primary" data-tap="onLogin">登录</button>
      <div class="wx-view other-login">
        <span class="wx-text other-text" data-tap="onWechatLogin">微信一键登录</span>
      </div>
    </div>
  </div>
</div>

<script>

<script src="../../common/runtime.js"></script>
<script src="../../common/app.js"></script>
<script src="./login.js"></script>
</body>
</html>
