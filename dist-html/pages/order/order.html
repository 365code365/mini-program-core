<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/order/order</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./order.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view nav-bar">
      <div class="wx-view nav-back" data-tap="onBack">
        <i class="wx-icon wxicon wxicon-back" style="width:20px;height:20px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 4 7.5 12 15.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <span class="wx-text nav-title">确认订单</span>
      <div class="wx-view nav-action"></div>
    </div>
    <div class="wx-view addr-card anim-fade-up" data-tap="onPickAddress">
      <div class="wx-view row">
        <i class="wx-icon wxicon wxicon-info_no_circle" style="width:18px;height:18px;color:#FF6B35"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.6" r="2" fill="currentColor"/><rect x="10.4" y="9.8" width="3.2" height="9.4" rx="1.6" fill="currentColor"/></svg></i>
        <div class="wx-view col addr-body">
          <div class="wx-view row">
            <span class="wx-text addr-name">张三</span>
            <span class="wx-text addr-phone">13800001111</span>
            <span class="wx-text tag-mini">默认</span>
          </div>
          <span class="wx-text addr-detail">广东省深圳市南山区 科技园路 1 号</span>
        </div>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
    </div>
    <div class="wx-view card">
      <span class="wx-text h2">商品清单</span>
    </div>
    <div class="wx-view card">
      <div class="wx-picker pick-line" data-change="onShipChange">
        <div class="wx-view row-between">
          <span class="wx-text h2">配送方式</span>
          <div class="wx-view row">
            <span class="wx-text muted">普通快递（免运费）</span>
            <i class="wx-icon wxicon wxicon-arrow_right" style="width:12px;height:12px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
          </div>
        </div>
      </div>
      <div class="wx-view divider gap"></div>
      <div class="wx-view row-between" data-tap="onPickCoupon">
        <span class="wx-text h2">优惠券</span>
        <div class="wx-view row">
          <span class="wx-text coupon-val">3 张可用</span>
          <i class="wx-icon wxicon wxicon-arrow_right" style="width:12px;height:12px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        </div>
      </div>
      <div class="wx-view divider gap"></div>
      <div class="wx-view row-between">
        <span class="wx-text h2">订单备注</span>
        <input class="wx-input remark" type="text" value="" placeholder="选填，如口味/发票信息" data-input="onRemarkInput">
      </div>
    </div>
    <div class="wx-view card">
      <span class="wx-text h2">支付方式</span>
      <div class="wx-radio-group" data-change="onPayChange">
        <div class="wx-label pay-line">
          <input class="wx-radio" type="radio" value="wechat" checked>
          <span class="wx-text pay-name">微信支付</span>
          <span class="wx-text muted">推荐</span>
        </div>
        <div class="wx-label pay-line">
          <input class="wx-radio" type="radio" value="alipay">
          <span class="wx-text pay-name">支付宝</span>
          <span class="wx-text muted"></span>
        </div>
        <div class="wx-label pay-line">
          <input class="wx-radio" type="radio" value="card">
          <span class="wx-text pay-name">银行卡</span>
          <span class="wx-text muted"></span>
        </div>
      </div>
    </div>
    <div class="wx-view card">
      <div class="wx-view row-between fee-line">
        <span class="wx-text muted">商品总额</span>
        <span class="wx-text fee">¥0.00</span>
      </div>
      <div class="wx-view row-between fee-line">
        <span class="wx-text muted">运费</span>
        <span class="wx-text fee">¥0.00</span>
      </div>
      <div class="wx-view row-between fee-line">
        <span class="wx-text muted">优惠券</span>
        <span class="wx-text fee-cut">-¥0.00</span>
      </div>
      <div class="wx-view divider gap"></div>
      <div class="wx-view row-between">
        <span class="wx-text h2">应付金额</span>
        <span class="wx-text price big">¥0.00</span>
      </div>
    </div>
    <div class="wx-view bottom-space"></div>
    <div class="wx-view submit-bar">
      <div class="wx-view col">
        <span class="wx-text muted">应付</span>
        <span class="wx-text price big">¥0.00</span>
      </div>
      <button class="wx-button submit-btn wx-button-primary" data-tap="onSubmit">提交订单</button>
    </div>
  </div>
</div>
