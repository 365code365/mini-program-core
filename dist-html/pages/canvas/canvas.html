  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">

    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view nav-bar">
      <div class="wx-view nav-back" data-tap="onBack">
        <i class="wx-icon wxicon wxicon-back" style="width:20px;height:20px;color:#ffffff"><svg viewBox="0 0 12 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M3.343 12l7.071 7.071L9 20.485l-7.778-7.778a1 1 0 010-1.414L9 3.515l1.414 1.414L3.344 12z"/></svg></i>
      </div>
      <span class="wx-text nav-title">Canvas 示例</span>
      <div class="wx-view nav-action" data-tap="onNavHome">
        <i class="wx-icon wxicon wxicon-success_no_circle" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" preserveAspectRatio="xMidYMid meet" aria-hidden="true"><path d="M8.657 18.435L3 12.778l1.414-1.414 4.95 4.95L20.678 5l1.414 1.414-12.02 12.021a1 1 0 01-1.415 0z"/></svg></i>
      </div>
    </div>
    <div class="wx-view header">
      <span class="wx-text title">Canvas 示例</span>
      <span class="wx-text subtitle">展示 Canvas 2D 绑图能力</span>
    </div>
    <div class="wx-view canvas-section">
      <div class="wx-view section-title">基础图形</div>
      <div class="wx-view canvas-box">
        <canvas class="wx-canvas canvas canvas-basic" data-canvas-id="canvas1"></canvas>
      </div>
      <div class="wx-view canvas-desc">矩形、圆形、线条</div>
    </div>
    <div class="wx-view canvas-section">
      <div class="wx-view section-title">渐变填充</div>
      <div class="wx-view canvas-box">
        <canvas class="wx-canvas canvas canvas-gradient" data-canvas-id="canvas2"></canvas>
      </div>
      <div class="wx-view canvas-desc">线性渐变、径向渐变</div>
    </div>
    <div class="wx-view canvas-section">
      <div class="wx-view section-title">图表</div>
      <div class="wx-view canvas-box canvas-chart-box">
        <canvas class="wx-canvas canvas canvas-chart" data-canvas-id="canvas3"></canvas>
      </div>
      <div class="wx-view canvas-desc">柱状图示例</div>
    </div>
    <div class="wx-view action-section">
      <button class="wx-button action-btn wx-button-default" data-tap="redraw">重新绑制</button>
      <button class="wx-button action-btn action-btn-clear wx-button-default" data-tap="clearAll">清除全部</button>
    </div>
    <div class="wx-view canvas-info">
      <span class="wx-text info-title">Canvas API 说明</span>
      <div class="wx-view info-item">
        <span class="wx-text info-label">wx.createCanvasContext(id)</span>
        <span class="wx-text info-desc">获取 2D 绑制上下文</span>
      </div>
      <div class="wx-view info-item">
        <span class="wx-text info-label">ctx.fillRect(x, y, w, h)</span>
        <span class="wx-text info-desc">绑制填充矩形</span>
      </div>
      <div class="wx-view info-item">
        <span class="wx-text info-label">ctx.arc(x, y, r, start, end)</span>
        <span class="wx-text info-desc">绑制圆弧/圆形</span>
      </div>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
