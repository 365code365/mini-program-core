<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/profile/profile</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./profile.css">
  <link rel="stylesheet" href="../../common/tabbar.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;padding-bottom:50px;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view user-header" data-tap="onUserTap">
      <img class="wx-image avatar-img" style="object-fit:cover" src="/assets/avatar1.jpg">
      <div class="wx-view user-info">
        <span class="wx-text user-name">未登录</span>
        <span class="wx-text user-level">点击登录 / 注册</span>
      </div>
      <i class="wx-icon wxicon wxicon-arrow_right" style="width:16px;height:16px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
    </div>
    <div class="wx-view order-section">
      <div class="wx-view row-between">
        <span class="wx-text order-title">我的订单</span>
        <div class="wx-view row" data-tap="onAllOrders">
          <span class="wx-text muted">全部订单</span>
          <i class="wx-icon wxicon wxicon-arrow_right" style="width:12px;height:12px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        </div>
      </div>
      <div class="wx-view order-row">
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="pending">
          <span class="wx-text order-num">0</span>
          <span class="wx-text order-label">待付款</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="paid">
          <span class="wx-text order-num">0</span>
          <span class="wx-text order-label">待发货</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="shipping">
          <span class="wx-text order-num">0</span>
          <span class="wx-text order-label">待收货</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="done">
          <span class="wx-text order-num">0</span>
          <span class="wx-text order-label">已完成</span>
        </div>
      </div>
    </div>
    <div class="wx-view menu-section">
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="address">
        <div class="wx-view menu-icon" style="background-color:#FF6B35">
          <i class="wx-icon wxicon wxicon-info_no_circle" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5.6" r="2" fill="currentColor"/><rect x="10.4" y="9.8" width="3.2" height="9.4" rx="1.6" fill="currentColor"/></svg></i>
        </div>
        <span class="wx-text menu-text">收货地址</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="coupon">
        <div class="wx-view menu-icon" style="background-color:#FAAD14">
          <i class="wx-icon wxicon wxicon-arrow_down" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8.5 12 16.5 20 8.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        </div>
        <span class="wx-text menu-text">优惠券</span>
        <span class="wx-text menu-value">3 张可领</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="cart">
        <div class="wx-view menu-icon" style="background-color:#52C41A">
          <i class="wx-icon wxicon wxicon-clock" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10.4" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M12 5.6V12h5.2" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></i>
        </div>
        <span class="wx-text menu-text">购物车</span>
        <span class="wx-text menu-value">空</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="search">
        <div class="wx-view menu-icon" style="background-color:#13c2c2">
          <i class="wx-icon wxicon wxicon-search" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.4" cy="10.4" r="6.4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M15.2 15.2 21 21" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></i>
        </div>
        <span class="wx-text menu-text">搜索历史</span>
        <span class="wx-text menu-value">0 条</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="showcase">
        <div class="wx-view menu-icon" style="background-color:#EB2F96">
          <i class="wx-icon wxicon wxicon-star" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 1.6 15.2 8.6 22.8 9.5 17.2 14.6 18.7 22 12 18.3 5.3 22 6.8 14.6 1.2 9.5 8.8 8.6Z" fill="currentColor"/></svg></i>
        </div>
        <span class="wx-text menu-text">能力展示</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="form">
        <div class="wx-view menu-icon" style="background-color:#722ed1">
          <i class="wx-icon wxicon wxicon-success_no_circle" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 12.5 9 18 20.5 5.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        </div>
        <span class="wx-text menu-text">表单与事件</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="canvas">
        <div class="wx-view menu-icon" style="background-color:#2F54EB">
          <i class="wx-icon wxicon wxicon-plus" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4.5V19.5M4.5 12H19.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></i>
        </div>
        <span class="wx-text menu-text">Canvas 绘图</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-key="components">
        <div class="wx-view menu-icon" style="background-color:#FA541C">
          <i class="wx-icon wxicon wxicon-warn_no_circle" style="width:18px;height:18px;color:#ffffff"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="10.4" y="3" width="3.2" height="11.2" rx="1.6" fill="currentColor"/><circle cx="12" cy="18.8" r="2" fill="currentColor"/></svg></i>
        </div>
        <span class="wx-text menu-text">组件示例</span>
        <i class="wx-icon wxicon wxicon-arrow_right" style="width:14px;height:14px;color:#cccccc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 4 16.5 12 8.5 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
    </div>
    <div class="wx-view logout-section">
      <button class="wx-button logout-btn wx-button-default" data-tap="onLogout">立即登录</button>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
<nav class="wx-custom-tabbar"><div class="wx-view custom-tabbar"><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-index="0" data-ds-path="pages/index/index" data-tabbar-href="../../pages/index/index.html"><i class="wx-icon wxicon wxicon-success" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span class="wx-text tabbar-label ">首页</span></div><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-path="pages/category/category" data-tabbar-href="../../pages/category/category.html" data-ds-index="1"><i class="wx-icon wxicon wxicon-info" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="7.6" r="1.7" fill="#fff"/><rect x="10.9" y="10.8" width="2.2" height="7" rx="1.1" fill="#fff"/></svg></i><span class="wx-text tabbar-label ">分类</span></div><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-index="2" data-ds-path="pages/cart/cart" data-tabbar-href="../../pages/cart/cart.html"><i class="wx-icon wxicon wxicon-waiting" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="6.2" width="2.2" height="6.6" rx="1.1" fill="#fff"/><rect x="12" y="10.9" width="5.2" height="2.2" rx="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i><span class="wx-text tabbar-label ">购物车</span></div><div class="wx-view tabbar-item active" data-tap="switchTab" data-ds-path="pages/profile/profile" data-tabbar-href="../../pages/profile/profile.html" data-ds-index="3"><i class="wx-icon wxicon wxicon-warn" style="width:24px;height:24px;color:#FF6B35"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="5.4" width="2.2" height="7.2" rx="1.1" fill="#fff"/><circle cx="12" cy="16.6" r="1.7" fill="#fff"/></svg></i><span class="wx-text tabbar-label label-active">我的</span></div></div></nav>
<script>
(function(){var bar=document.currentScript&&document.currentScript.previousElementSibling;
if(!bar||!bar.classList.contains('wx-custom-tabbar')){bar=document.querySelector('.wx-custom-tabbar');}
if(!bar)return;
bar.addEventListener('click',function(e){
var el=e.target.closest?e.target.closest('[data-tabbar-href]'):null;
if(!el)return;
var href=el.getAttribute('data-tabbar-href');
if(href){e.preventDefault();e.stopPropagation();window.location.href=href;}
},true);})();
</script>
