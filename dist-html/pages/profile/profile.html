<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/profile/profile</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./profile.css">
  <link rel="stylesheet" href="../../common/tabbar.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;padding-bottom:50px;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view user-header" data-tap="onUserTap">
      <div class="wx-view avatar">
        <i class="wx-icon wxicon wxicon-success" style="width:48px;height:48px;color:#fff"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
      </div>
      <div class="wx-view user-info">
        <span class="wx-text user-name">点击登录</span>
        <span class="wx-text user-level">点击登录 / 注册</span>
      </div>
      <span class="wx-text menu-arrow">&gt;</span>
    </div>
    <div class="wx-view order-section">
      <div class="wx-view order-title">我的订单</div>
      <div class="wx-view order-row">
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="pending">
          <span class="wx-text order-num">2</span>
          <span class="wx-text order-label">待付款</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="shipping">
          <span class="wx-text order-num">1</span>
          <span class="wx-text order-label">待发货</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="receiving">
          <span class="wx-text order-num">3</span>
          <span class="wx-text order-label">待收货</span>
        </div>
        <div class="wx-view order-item" data-tap="onOrderTap" data-ds-type="review">
          <span class="wx-text order-num">5</span>
          <span class="wx-text order-label">待评价</span>
        </div>
      </div>
    </div>
    <div class="wx-view menu-section">
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="1">
        <i class="wx-icon wxicon wxicon-success" style="width:24px;height:24px;color:#FF6B35"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i>
        <span class="wx-text menu-text">收货地址</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="2">
        <i class="wx-icon wxicon wxicon-warn" style="width:24px;height:24px;color:#FF69B4"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="5.4" width="2.2" height="7.2" rx="1.1" fill="#fff"/><circle cx="12" cy="16.6" r="1.7" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">我的收藏</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="3">
        <i class="wx-icon wxicon wxicon-waiting" style="width:24px;height:24px;color:#52C41A"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="6.2" width="2.2" height="6.6" rx="1.1" fill="#fff"/><rect x="12" y="10.9" width="5.2" height="2.2" rx="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">优惠券</span>
        <span class="wx-text menu-value">5张可用</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
      <div class="wx-view menu-item" data-tap="onMenuTap" data-ds-id="4">
        <i class="wx-icon wxicon wxicon-info" style="width:24px;height:24px;color:#4A90D9"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="7.6" r="1.7" fill="#fff"/><rect x="10.9" y="10.8" width="2.2" height="7" rx="1.1" fill="#fff"/></svg></i>
        <span class="wx-text menu-text">帮助中心</span>
        <span class="wx-text menu-arrow">&gt;</span>
      </div>
    </div>
    <div class="wx-view logout-section">
      <button class="wx-button logout-btn wx-button-default" data-tap="onLogout">退出登录</button>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
<nav class="wx-custom-tabbar"><div class="wx-view custom-tabbar"><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-index="0" data-ds-path="pages/index/index" data-tabbar-href="../../pages/index/index.html"><i class="wx-icon wxicon wxicon-success" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><path d="M5.8 12.4 10 16.4 18.2 7.6" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></i><span class="wx-text tabbar-label ">首页</span></div><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-index="1" data-ds-path="pages/category/category" data-tabbar-href="../../pages/category/category.html"><i class="wx-icon wxicon wxicon-info" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><circle cx="12" cy="7.6" r="1.7" fill="#fff"/><rect x="10.9" y="10.8" width="2.2" height="7" rx="1.1" fill="#fff"/></svg></i><span class="wx-text tabbar-label ">分类</span></div><div class="wx-view tabbar-item " data-tap="switchTab" data-ds-path="pages/cart/cart" data-tabbar-href="../../pages/cart/cart.html" data-ds-index="2"><i class="wx-icon wxicon wxicon-waiting" style="width:24px;height:24px;color:#999"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="6.2" width="2.2" height="6.6" rx="1.1" fill="#fff"/><rect x="12" y="10.9" width="5.2" height="2.2" rx="1.1" fill="#fff"/><circle cx="12" cy="12" r="1.6" fill="#fff"/></svg></i><span class="wx-text tabbar-label ">购物车</span></div><div class="wx-view tabbar-item active" data-tap="switchTab" data-ds-index="3" data-ds-path="pages/profile/profile" data-tabbar-href="../../pages/profile/profile.html"><i class="wx-icon wxicon wxicon-warn" style="width:24px;height:24px;color:#FF6B35"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="currentColor"/><rect x="10.9" y="5.4" width="2.2" height="7.2" rx="1.1" fill="#fff"/><circle cx="12" cy="16.6" r="1.7" fill="#fff"/></svg></i><span class="wx-text tabbar-label label-active">我的</span></div></div></nav>
<script>
(function(){var bar=document.currentScript&&document.currentScript.previousElementSibling;
if(!bar||!bar.classList.contains('wx-custom-tabbar')){bar=document.querySelector('.wx-custom-tabbar');}
if(!bar)return;
bar.addEventListener('click',function(e){
var el=e.target.closest?e.target.closest('[data-tabbar-href]'):null;
if(!el)return;
var href=el.getAttribute('data-tabbar-href');
if(href){e.preventDefault();e.stopPropagation();window.location.href=href;}
},true);})();
</script>
