<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pages/form/form</title>
  <link rel="stylesheet" href="../../common/base.css">
  <link rel="stylesheet" href="../../common/app.css">
  <link rel="stylesheet" href="./form.css">
  <style>
    #app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}
  </style>
</head>
<body>
<div id="app">
  <div class="wx-view page">
    <div class="wx-view header">
      <span class="wx-text title">表单与事件</span>
      <span class="wx-text subtitle">双向绑定 · setData 响应式 · 各类事件</span>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">双向绑定 model:value</span>
      <input class="wx-input field" type="text" value="小明" placeholder="输入昵称，实时同步">
      <textarea class="wx-textarea field textarea"></textarea>
      <div class="wx-view preview">
        <span class="wx-text preview-line">昵称：小明</span>
        <span class="wx-text preview-line">简介：</span>
        <span class="wx-text preview-line">昵称长度：2</span>
      </div>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">bindinput 事件</span>
      <input class="wx-input field" type="text" value="" placeholder="搜索（bindinput）" data-input="onSearchInput">
      <span class="wx-text hint">输入点什么试试</span>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">计数器（tap + setData）</span>
      <div class="wx-view counter">
        <button class="wx-button cbtn wx-button-default wx-button-mini" data-tap="onDec">-</button>
        <span class="wx-text cval">0</span>
        <button class="wx-button cbtn wx-button-primary wx-button-mini" data-tap="onInc">+</button>
        <button class="wx-button cbtn reset wx-button-default wx-button-mini" data-tap="onReset">清零</button>
      </div>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">开关与滑块</span>
      <div class="wx-view row">
        <span class="wx-text label">推送通知</span>
        <div class="wx-switch wx-switch-on" data-change="onPushChange"><span class="wx-switch-knob"></span></div>
        <span class="wx-text state">开</span>
      </div>
      <div class="wx-view row">
        <span class="wx-text label">音量 60</span>
        <input class="wx-slider slider" type="range" min="0" max="100" step="1" value="60" data-change="onVolume">
      </div>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">多选与单选</span>
      <div class="wx-checkbox-group opts" data-change="onHobby">
        <div class="wx-label opt">
          <input class="wx-checkbox" type="checkbox" value="read" checked>
          <span class="wx-text">阅读</span>
        </div>
        <div class="wx-label opt">
          <input class="wx-checkbox" type="checkbox" value="sport">
          <span class="wx-text">运动</span>
        </div>
        <div class="wx-label opt">
          <input class="wx-checkbox" type="checkbox" value="music" checked>
          <span class="wx-text">音乐</span>
        </div>
      </div>
      <span class="wx-text hint">已选爱好：阅读、音乐</span>
      <div class="wx-radio-group opts" data-change="onGender">
        <div class="wx-label opt">
          <input class="wx-radio" type="radio" value="male" checked>
          <span class="wx-text">男</span>
        </div>
        <div class="wx-label opt">
          <input class="wx-radio" type="radio" value="female">
          <span class="wx-text">女</span>
        </div>
      </div>
      <span class="wx-text hint">性别：male</span>
    </div>
    <div class="wx-view section">
      <span class="wx-text section-title">form 表单提交</span>
      <div class="wx-form" data-reset="onReset2" data-submit="onSubmit">
        <input class="wx-input field" type="text" placeholder="用户名">
        <input class="wx-input field" type="number" placeholder="手机号">
        <div class="wx-view form-actions">
          <button class="wx-button cbtn wx-button-default wx-button-mini">重置</button>
          <button class="wx-button cbtn wx-button-primary wx-button-mini">提交</button>
        </div>
      </div>
    </div>
    <div class="wx-view back-btn" data-tap="onBack">
      <span class="wx-text back-text">返回首页</span>
    </div>
  </div>
</div>
