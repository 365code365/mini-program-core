        </span>
          <span class="wx-text hot-tag" data-tap="onTapTag" data-ds-k="运动鞋">运动鞋

          <span class="wx-text hot-tag" data-tap="onTapTag" data-ds-k="咖啡">咖啡
        </span>
          <span class="wx-text hot-tag" data-tap="onTapTag" data-ds-k="手机">手机
        </span>
          <span class="wx-text hot-tag" data-tap="onTapTag" data-ds-k="口红">口红
        </span>
          <span class="wx-text hot-tag" data-tap="onTapTag" data-ds-k="保温杯">保温杯
        </span>

      </div>
      <div class="wx-view card">
        <span class="wx-text h2">大家都在买</span>
        <div class="wx-view rank" data-tap="onProductTap" data-ds-id="105">

          <img class="wx-image rank-img" style="object-fit:cover" src="/assets/p_coffee.jpg">
          <div class="wx-view col grow rank-info">
            <span class="wx-text rank-name">精品咖啡礼盒</span>
            <span class="wx-text muted">中深烘焙 12 包</span>
          </div>
          <span class="wx-text price">¥89</span>
        </div>
        <div class="wx-view rank" data-tap="onProductTap" data-ds-id="107">
          <span class="wx-text rank-no rank-no-top">2</span>
          <img class="wx-image rank-img" style="object-fit:cover" src="/assets/p_lipstick.jpg">
          <div class="wx-view col grow rank-info">
            <span class="wx-text rank-name">轻奢口红套装</span>
            <span class="wx-text muted">三色礼盒</span>
          </div>
          <span class="wx-text price">¥269</span>
        </div>
        <div class="wx-view rank" data-tap="onProductTap" data-ds-id="103">
          <span class="wx-text rank-no rank-no-top">3</span>
          <img class="wx-image rank-img" style="object-fit:cover" src="/assets/p_sneakers.jpg">

            <span class="wx-text rank-name">潮流运动鞋</span>
            <span class="wx-text muted">轻量缓震</span>
          </div>
          <span class="wx-text price">¥329</span>
        </div>
        <div class="wx-view rank" data-tap="onProductTap" data-ds-id="108">
          <span class="wx-text rank-no rank-no-normal">4</span>
          <img class="wx-image rank-img" style="object-fit:cover" src="/assets/p_thermos.jpg">
          <div class="wx-view col grow rank-info">
            <span class="wx-text rank-name">保温杯 500ml</span>
            <span class="wx-text muted">316 内胆</span>
          </div>
          <span class="wx-text price">¥129</span>
        </div>
        <div class="wx-view rank" data-tap="onProductTap" data-ds-id="101">
          <span class="wx-text rank-no rank-no-normal">5</span>
          <img class="wx-image rank-img" style="object-fit:cover" src="/assets/p_earbuds.jpg">
          <div class="wx-view col grow rank-info">
            <span class="wx-text rank-name">无线蓝牙耳机 Pro</span>
            <span class="wx-text muted">降噪 · 40小时续航</span>
          </div>
          <span class="wx-text price">¥199</span>
        </div>
      </div>
    </div>
    <div class="wx-view bottom-space"></div>
  </div>
</div>
