<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pages/components/components</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
view,scroll-view,swiper,swiper-item,cover-view{display:flex;flex-direction:column;}
image{display:block;}
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:block;width:100%;}
input,textarea{border:0;outline:none;background:none;font:inherit;color:inherit;width:100%;}
a{color:inherit;text-decoration:none;}
body{font-size:16px;color:#333;font-family:-apple-system,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f6f8;}
/* 内置矢量图标（对齐 <icon type> 常用类型）*/
.wxicon{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;color:#fff;font-style:normal;font-size:.7em;line-height:1;}
.wxicon-success{background:#09bb07;}.wxicon-success::before{content:"\2713";}
.wxicon-info{background:#10aeff;}.wxicon-info::before{content:"i";font-weight:bold;}
.wxicon-warn{background:#f76260;}.wxicon-warn::before{content:"!";font-weight:bold;}
.wxicon-waiting{background:#10aeff;}.wxicon-waiting::before{content:"\2026";}
.wxicon-cancel{background:#f43530;}.wxicon-cancel::before{content:"\2715";}
.wxicon-download{background:#09bb07;}.wxicon-download::before{content:"\2193";}
.wxicon-search{background:#b2b2b2;}.wxicon-search::before{content:"\1F50D";}
.wxicon-clear{background:#b2b2b2;}.wxicon-clear::before{content:"\2715";}

#app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}

.container {
  padding: 10px;
  background-color: #f5f5f5;
  min-height: 100vh;
}

.header {
  padding: 15px 0;
  text-align: center;
}

.title {
  font-size: 18px;
  font-weight: bold;
  color: #333;
}

.section {
  background-color: #fff;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 12px;
}

.section-title {
  font-size: 14px;
  font-weight: bold;
  color: #333;
  margin-bottom: 10px;
  display: block;
}

/* Swiper */
.swiper {
  width: 100%;
  height: 150px;
  border-radius: 6px;
}

.swiper-item {
  display: flex;
  justify-content: center;
  align-items: center;
}

.swiper-text {
  font-size: 16px;
  color: #fff;
  font-weight: bold;
}

/* Picker */
.picker-item {
  padding: 10px;
  background-color: #f8f8f8;
  border-radius: 4px;
}

.picker-item text {
  font-size: 14px;
  color: #333;
}

/* Rich-text */
.rich-text-box {
  padding: 10px;
  background-color: #f8f8f8;
  border-radius: 4px;
  min-height: 40px;
}

/* Checkbox & Radio */
.checkbox-item,
.radio-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 8px 0;
}

.checkbox-item text,
.radio-item text {
  font-size: 14px;
  color: #333;
  margin-left: 8px;
}

/* Back button */
.back-btn {
  margin-top: 20px;
  padding: 12px;
  background-color: #07c160;
  border-radius: 6px;
  text-align: center;
}

.back-text {
  font-size: 14px;
  color: #fff;
}

</style></head>
<body><div id="app"><div class="container"><div class="header"><span class="title">组件示例</span></div><div class="section"><span class="section-title">Swiper 轮播图</span><div class="swiper" style="overflow:hidden;position:relative"><div class="swiper-item" style="background-color: #FF6B35;"><span class="swiper-text">第一页</span></div><div class="swiper-item" style="background-color: #07c160;"><span class="swiper-text">第二页</span></div><div class="swiper-item" style="background-color: #1890ff;"><span class="swiper-text">第三页</span></div></div></div><div class="section"><span class="section-title">Picker 选择器</span><div data-change="onPickerChange"><div class="picker-item"><span>当前选择：选项一</span></div></div></div><div class="section"><span class="section-title">Rich-text 富文本</span><div class="rich-text-box"></div></div><div class="section"><span class="section-title">Checkbox Group</span><div data-change="onCheckboxChange"><div class="checkbox-item"><div></div><span>苹果</span></div><div class="checkbox-item"><div></div><span>香蕉</span></div><div class="checkbox-item"><div></div><span>橙子</span></div></div></div><div class="section"><span class="section-title">Radio Group</span><div data-change="onRadioChange"><div class="radio-item"><div></div><span>男</span></div><div class="radio-item"><div></div><span>女</span></div></div></div><div class="back-btn" data-tap="onBack"><span class="back-text">返回首页</span></div></div></div></body></html>
