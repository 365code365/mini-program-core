<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pages/canvas/canvas</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
view,scroll-view,swiper,swiper-item,cover-view{display:flex;flex-direction:column;}
image{display:block;}
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:block;width:100%;}
input,textarea{border:0;outline:none;background:none;font:inherit;color:inherit;width:100%;}
a{color:inherit;text-decoration:none;}
body{font-size:16px;color:#333;font-family:-apple-system,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f6f8;}
/* 内置矢量图标（对齐 <icon type> 常用类型）*/
.wxicon{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;color:#fff;font-style:normal;font-size:.7em;line-height:1;}
.wxicon-success{background:#09bb07;}.wxicon-success::before{content:"\2713";}
.wxicon-info{background:#10aeff;}.wxicon-info::before{content:"i";font-weight:bold;}
.wxicon-warn{background:#f76260;}.wxicon-warn::before{content:"!";font-weight:bold;}
.wxicon-waiting{background:#10aeff;}.wxicon-waiting::before{content:"\2026";}
.wxicon-cancel{background:#f43530;}.wxicon-cancel::before{content:"\2715";}
.wxicon-download{background:#09bb07;}.wxicon-download::before{content:"\2193";}
.wxicon-search{background:#b2b2b2;}.wxicon-search::before{content:"\1F50D";}
.wxicon-clear{background:#b2b2b2;}.wxicon-clear::before{content:"\2715";}

#app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}

.page {
  padding: 16px;
  background-color: #f5f5f5;
  min-height: 100%;
}

.header {
  text-align: center;
  margin-bottom: 20px;
}

.title {
  font-size: 24px;
  font-weight: bold;
  color: #333;
  display: block;
}

.subtitle {
  font-size: 14px;
  color: #666;
  margin-top: 8px;
  display: block;
}

.canvas-section {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 16px;
}

.section-title {
  font-size: 16px;
  font-weight: bold;
  color: #333;
  margin-bottom: 12px;
}

.canvas-box {
  background: #fafafa;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  justify-content: center;
  align-items: center;
}

.canvas {
  background: #fff;
  border: 1px solid #eee;
  border-radius: 4px;
}

.canvas-basic {
  width: 300px;
  height: 150px;
}

.canvas-gradient {
  width: 300px;
  height: 120px;
}

.canvas-chart {
  width: 320px;
  height: 180px;
}

.canvas-desc {
  font-size: 12px;
  color: #999;
  text-align: center;
  margin-top: 8px;
}

.action-section {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.action-btn {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-size: 16px;
  background: #07c160;
  color: #fff;
}

.action-btn-clear {
  background: #999;
}

.canvas-info {
  background: #fff;
  border-radius: 12px;
  padding: 16px;
  margin-top: 16px;
}

.info-title {
  font-size: 16px;
  font-weight: bold;
  color: #333;
  margin-bottom: 12px;
  display: block;
}

.info-item {
  padding: 8px 0;
  border-bottom: 1px solid #f0f0f0;
}

.info-label {
  font-size: 13px;
  color: #07c160;
  display: block;
}

.info-desc {
  font-size: 12px;
  color: #666;
  margin-top: 4px;
  display: block;
}

.bottom-space {
  height: 80px;
}

</style></head>
<body><div id="app"><div class="page"><div class="header"><span class="title">Canvas 示例</span><span class="subtitle">展示 Canvas 2D 绑图能力</span></div><div class="canvas-section"><div class="section-title">基础图形</div><div class="canvas-box"><div class="canvas canvas-basic"></div></div><div class="canvas-desc">矩形、圆形、线条</div></div><div class="canvas-section"><div class="section-title">渐变填充</div><div class="canvas-box"><div class="canvas canvas-gradient"></div></div><div class="canvas-desc">线性渐变、径向渐变</div></div><div class="canvas-section"><div class="section-title">图表</div><div class="canvas-box canvas-chart-box"><div class="canvas canvas-chart"></div></div><div class="canvas-desc">柱状图示例</div></div><div class="action-section"><button class="action-btn" data-tap="redraw">重新绑制</button><button class="action-btn action-btn-clear" data-tap="clearAll">清除全部</button></div><div class="canvas-info"><span class="info-title">Canvas API 说明</span><div class="info-item"><span class="info-label">wx.createCanvasContext(id)</span><span class="info-desc">获取 2D 绑制上下文</span></div><div class="info-item"><span class="info-label">ctx.fillRect(x, y, w, h)</span><span class="info-desc">绑制填充矩形</span></div><div class="info-item"><span class="info-label">ctx.arc(x, y, r, start, end)</span><span class="info-desc">绑制圆弧/圆形</span></div></div><div class="bottom-space"></div></div></div></body></html>
