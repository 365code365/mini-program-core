<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pages/cart/cart</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
view,scroll-view,swiper,swiper-item,cover-view{display:flex;flex-direction:column;}
image{display:block;}
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:block;width:100%;}
input,textarea{border:0;outline:none;background:none;font:inherit;color:inherit;width:100%;}
a{color:inherit;text-decoration:none;}
body{font-size:16px;color:#333;font-family:-apple-system,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f6f8;}
/* 内置矢量图标（对齐 <icon type> 常用类型）*/
.wxicon{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;color:#fff;font-style:normal;font-size:.7em;line-height:1;}
.wxicon-success{background:#09bb07;}.wxicon-success::before{content:"\2713";}
.wxicon-info{background:#10aeff;}.wxicon-info::before{content:"i";font-weight:bold;}
.wxicon-warn{background:#f76260;}.wxicon-warn::before{content:"!";font-weight:bold;}
.wxicon-waiting{background:#10aeff;}.wxicon-waiting::before{content:"\2026";}
.wxicon-cancel{background:#f43530;}.wxicon-cancel::before{content:"\2715";}
.wxicon-download{background:#09bb07;}.wxicon-download::before{content:"\2193";}
.wxicon-search{background:#b2b2b2;}.wxicon-search::before{content:"\1F50D";}
.wxicon-clear{background:#b2b2b2;}.wxicon-clear::before{content:"\2715";}

#app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}

.page {
  background-color: #F5F5F5;
}

.header {
  background-color: #FF6B35;
  padding: 15px;
}

.header-title {
  font-size: 18px;
  color: #fff;
  font-weight: bold;
}

/* 空购物车 */
.empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding-top: 100px;
}

.empty-text {
  font-size: 16px;
  color: #999;
  margin: 20px 0;
}

/* 购物车列表 */
.cart-list {
  padding: 10px;
}

.cart-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  background-color: #fff;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
}

.item-icon {
  width: 60px;
  height: 60px;
  background-color: #f5f5f5;
  border-radius: 6px;
  margin: 0 8px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.item-info {
  flex: 1;
}

.item-name {
  display: block;
  font-size: 14px;
  color: #333;
}

.item-row {
  display: flex;
  flex-direction: row;
  justify-content: space-between;
  align-items: center;
  margin-top: 8px;
}

.item-price {
  font-size: 15px;
  color: #FF6B35;
  font-weight: bold;
}

.qty-box {
  display: flex;
  flex-direction: row;
  align-items: center;
  background-color: #f5f5f5;
  border-radius: 4px;
}

.qty-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.qty-btn text {
  font-size: 14px;
  color: #666;
}

.qty-num {
  width: 24px;
  text-align: center;
  font-size: 13px;
}

.delete-btn {
  padding: 8px;
}

/* 底部结算 */
.checkout {
  position: fixed;
  bottom: 60px;
  left: 0;
  right: 0;
  height: 50px;
  background-color: #fff;
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 0 10px;
  border-top: 0.500px solid #eee;
}

.checkout-left {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.select-text {
  font-size: 14px;
  color: #333;
  margin-left: 4px;
}

.checkout-right {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: flex-end;
}

.total-text {
  font-size: 14px;
  color: #333;
}

.total-price {
  font-size: 16px;
  color: #FF6B35;
  font-weight: bold;
  margin-right: 8px;
}

.checkout-btn {
  background-color: #FF6B35;
  border-radius: 16px;
}

.bottom-space {
  height: 0;
}

</style></head>
<body><div id="app"><div class="page"><div class="header"><span class="header-title">🛒 购物车</span></div><div class="empty"><i class="wxicon wxicon-info"></i><span class="empty-text">购物车是空的</span><button data-tap="goShopping">去逛逛</button></div><div class="bottom-space"></div></div></div></body></html>
