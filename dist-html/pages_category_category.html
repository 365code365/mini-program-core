<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pages/category/category</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
view,scroll-view,swiper,swiper-item,cover-view{display:flex;flex-direction:column;}
image{display:block;}
button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;display:block;width:100%;}
input,textarea{border:0;outline:none;background:none;font:inherit;color:inherit;width:100%;}
a{color:inherit;text-decoration:none;}
body{font-size:16px;color:#333;font-family:-apple-system,system-ui,"PingFang SC","Hiragino Sans GB",sans-serif;background:#f5f6f8;}
/* 内置矢量图标（对齐 <icon type> 常用类型）*/
.wxicon{display:inline-flex;align-items:center;justify-content:center;width:1.2em;height:1.2em;border-radius:50%;color:#fff;font-style:normal;font-size:.7em;line-height:1;}
.wxicon-success{background:#09bb07;}.wxicon-success::before{content:"\2713";}
.wxicon-info{background:#10aeff;}.wxicon-info::before{content:"i";font-weight:bold;}
.wxicon-warn{background:#f76260;}.wxicon-warn::before{content:"!";font-weight:bold;}
.wxicon-waiting{background:#10aeff;}.wxicon-waiting::before{content:"\2026";}
.wxicon-cancel{background:#f43530;}.wxicon-cancel::before{content:"\2715";}
.wxicon-download{background:#09bb07;}.wxicon-download::before{content:"\2193";}
.wxicon-search{background:#b2b2b2;}.wxicon-search::before{content:"\1F50D";}
.wxicon-clear{background:#b2b2b2;}.wxicon-clear::before{content:"\2715";}

#app{width:375px;min-height:100vh;margin:0 auto;background:#f5f6f8;position:relative;overflow:hidden;}

.page {
  background-color: #F5F5F5;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* 搜索栏 */
.search-bar {
  background-color: #FF6B35;
  padding: 10px 12px;
  flex-shrink: 0;
}

.search-input {
  background-color: #fff;
  border-radius: 16px;
  padding: 8px 12px;
  display: flex;
  flex-direction: row;
  align-items: center;
}

.search-placeholder {
  font-size: 13px;
  color: #999;
  margin-left: 6px;
}

/* 主体内容 - 左右布局 */
.main-content {
  display: flex;
  flex-direction: row;
  flex: 1;
  overflow: hidden;
}

/* 左侧分类导航 - 固定宽度，需要固定高度才能滚动 */
.category-nav {
  width: 90px;
  min-width: 90px;
  max-width: 90px;
  height: 450px;
  background-color: #F5F5F5;
}

.category-item {
  height: 120px;
  padding: 0 8px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  background-color: #F5F5F5;
}

.category-item text {
  font-size: 13px;
  color: #666;
}

.category-item.active {
  background-color: #fff;
}

.category-item.active text {
  color: #FF6B35;
  font-weight: bold;
}

.category-badge {
  background-color: #FF6B35;
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 8px;
  margin-left: 4px;
}

/* 右侧商品列表 - 占满剩余空间 */
.product-list {
  flex: 1;
  background-color: #fff;
  overflow-y: scroll; /* Allow vertical scrolling */
}

.category-title {
  padding: 12px;
  border-bottom: 0.500px solid #f0f0f0;
}

.category-title text {
  font-size: 14px;
  color: #333;
  font-weight: bold;
}

/* 商品项 - 横向布局 */
.product-item {
  display: flex;
  flex-direction: row;
  padding: 12px;
  border-bottom: 0.500px solid #f5f5f5;
}

.product-image {
  width: 70px;
  height: 70px;
  min-width: 70px;
  background-color: #f9f9f9;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.product-info {
  flex: 1;
  margin-left: 10px;
  display: flex;
  flex-direction: column;
}

.product-name {
  font-size: 14px;
  color: #333;
  font-weight: 500;
}

.product-desc {
  font-size: 12px;
  color: #999;
  margin-top: 4px;
}

.product-bottom {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  margin-top: 8px;
}

.product-price {
  font-size: 16px;
  color: #FF6B35;
  font-weight: bold;
}

/* 数量控制 - 横向布局 */
.quantity-control {
  display: flex;
  flex-direction: row;
  align-items: center;
}

.minus-btn {
  width: 24px;
  height: 24px;
  border-radius: 12px;
  background-color: #fff;
  border: 0.500px solid #ddd;
  display: flex;
  align-items: center;
  justify-content: center;
}

.minus-btn text {
  font-size: 16px;
  color: #666;
}

.plus-btn {
  width: 24px;
  height: 24px;
  border-radius: 12px;
  background-color: #FF6B35;
  display: flex;
  align-items: center;
  justify-content: center;
}

.plus-btn text {
  font-size: 16px;
  color: #fff;
}

.quantity {
  font-size: 14px;
  color: #333;
  min-width: 24px;
  text-align: center;
}

/* 底部购物车栏 */
.cart-bar {
  height: 50px;
  background-color: #2D2D2D;
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 0 12px;
  z-index: 101; /* Ensure it is above the mask */
}

.cart-left {
  flex: 1;
  display: flex;
  flex-direction: row;
  align-items: center;
}

.cart-icon-wrap {
  width: 40px;
  height: 40px;
  background-color: #3D3D3D;
  border-radius: 20px;
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
}

.cart-badge-icon {
  background-color: #FF6B35;
  color: #fff;
  font-size: 10px;
  padding: 1px 4px;
  border-radius: 6px;
  margin-left: -8px;
  margin-top: -16px;
}

.cart-info {
  margin-left: 8px;
  display: flex;
  flex-direction: column;
}

.cart-total {
  font-size: 16px;
  color: #fff;
  font-weight: bold;
}

.cart-tip {
  font-size: 11px;
  color: #999;
  margin-top: 2px;
}

.cart-right {
  width: 100px;
  height: 36px;
  background-color: #535353;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cart-right text {
  font-size: 14px;
  color: #999;
}

.cart-right.active {
  background-color: #52C41A;
}

.cart-right.active text {
  color: #fff;
}

/* 购物车弹窗遮罩 */
.cart-popup-mask {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(0, 0, 0, 0.5);
  z-index: 99;
}

/* 购物车弹窗 */
.cart-popup {
  background-color: #fff;
  border-radius: 12px 12px 0 0;
  max-height: 300px;
  z-index: 100;
}

.cart-popup-header {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  padding: 12px;
  border-bottom: 0.500px solid #f0f0f0;
}

.cart-popup-title {
  font-size: 15px;
  color: #333;
  font-weight: bold;
}

.cart-clear {
  padding: 4px 8px;
}

.cart-clear text {
  font-size: 13px;
  color: #999;
}

.cart-popup-list {
  max-height: 250px;
}

.cart-popup-item {
  display: flex;
  flex-direction: row;
  align-items: center;
  padding: 12px;
  border-bottom: 0.500px solid #f5f5f5;
}

.cart-item-name {
  flex: 1;
  font-size: 14px;
  color: #333;
}

.cart-item-price {
  font-size: 14px;
  color: #FF6B35;
  font-weight: bold;
  margin-right: 12px;
}

</style></head>
<body><div id="app"><div class="page"><div class="search-bar"><div class="search-input"><i class="wxicon wxicon-search"></i><span class="search-placeholder">搜索商品</span></div></div><div class="main-content"><div class="category-nav" style="overflow-y:auto"><div class="category-item active" data-tap="onSelectCategory" data-ds-id="0"><span>热销</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="1"><span>主食</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="2"><span>小吃</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="3"><span>饮品</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="4"><span>甜点</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="5"><span>套餐</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="6"><span>早餐</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="7"><span>夜宵</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="8"><span>沙拉</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="9"><span>沙拉1</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="10"><span>沙拉2</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="11"><span>沙拉4</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="12"><span>沙拉5</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="13"><span>沙拉6</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="14"><span>沙拉1</span></div><div class="category-item " data-tap="onSelectCategory" data-ds-id="15"><span>汤品1</span></div></div><div class="product-list"><div class="category-title"><span>热销</span></div><div class="product-item"><div class="product-image"><i class="wxicon wxicon-success"></i></div><div class="product-info"><span class="product-name">招牌炒饭</span><span class="product-desc">蛋炒饭配火腿肠</span><div class="product-bottom"><span class="product-price">¥18</span><div class="quantity-control"><div class="plus-btn" data-tap="onPlus" data-ds-id="101"><span>+</span></div></div></div></div></div><div class="product-item"><div class="product-image"><i class="wxicon wxicon-info"></i></div><div class="product-info"><span class="product-name">红烧牛肉面</span><span class="product-desc">大块牛肉 劲道面条</span><div class="product-bottom"><span class="product-price">¥26</span><div class="quantity-control"><div class="plus-btn" data-tap="onPlus" data-ds-id="102"><span>+</span></div></div></div></div></div><div class="product-item"><div class="product-image"><i class="wxicon wxicon-waiting"></i></div><div class="product-info"><span class="product-name">鸡腿饭</span><span class="product-desc">香酥鸡腿配米饭</span><div class="product-bottom"><span class="product-price">¥22</span><div class="quantity-control"><div class="plus-btn" data-tap="onPlus" data-ds-id="103"><span>+</span></div></div></div></div></div></div></div><div class="cart-bar" style="position: fixed; bottom: 56px; left: 0; right: 0;"><div class="cart-left" data-tap="onShowCart"><div class="cart-icon-wrap"><i class="wxicon wxicon-success"></i></div><div class="cart-info"><span class="cart-total">¥0.00</span><span class="cart-tip">另需配送费¥5</span></div></div><div class="cart-right" data-tap="onCheckout"><button style="border-radius: 30px;background: #012000;color: black">未选购商品</button></div></div></div></div></body></html>
