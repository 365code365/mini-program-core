# 与 Flutter 示例同一组 JVM 参数：本机已经开着的 Gradle 守护进程可以直接复用，不再多起一个
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
# 引擎库在工程外（../../src/main/jniLibs）：守护进程开着文件监视时，那边换了库它常常当没变，
# APK 里还是旧库。关掉监视，每次都重新比对（与 Flutter 示例同一个坑）
org.gradle.vfs.watch=false
