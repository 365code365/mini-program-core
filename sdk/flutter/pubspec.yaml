name: mini_render
description: "在 Flutter 里打开微信小程序：mini-render 引擎（Rust 自绘、对标 Skyline）的 Flutter 插件。"
version: 0.1.0
publish_to: none
repository: https://github.com/365code365/mini-program-core

environment:
  sdk: ">=3.7.0 <4.0.0"
  # SurfaceProducer 的 onSurfaceAvailable / onSurfaceCleanup（Android）要 3.29+
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.minirender.flutter
        pluginClass: MiniRenderPlugin
      ios:
        pluginClass: MiniRenderPlugin
